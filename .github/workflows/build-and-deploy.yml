name: Build and Deploy Langsame Nachrichten

on:
  # schedule:
  #   - cron: '23 19 * * *'  # 19:23 UTC ≈ 6:23 AM AEDT
  workflow_dispatch:        # Manual trigger for testing

concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -e .

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Build today's content
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m backend.build

      - name: Build Tailwind CSS
        run: |
          npm install tailwindcss @tailwindcss/cli
          npx @tailwindcss/cli -i frontend/input.css -o frontend/styles.css --minify

      - name: Assemble site
        run: |
          mkdir -p _site/content
          cp -r frontend/* _site/
          rm -f _site/input.css
          cp -r output/content/* _site/content/
          # Generate archive.json with today's date
          TODAY=$(date +%Y-%m-%d)
          echo "{\"dates\": [\"$TODAY\"]}" > _site/content/archive.json

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
